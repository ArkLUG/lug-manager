<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check-in Kiosk — {{title}}</title>
  <link rel="stylesheet" href="/static/tailwind.min.css">
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/theme.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
  <div class="max-w-6xl mx-auto grid md:grid-cols-2 gap-10 items-center min-h-[85vh]">
    <div class="text-center">
      <h1 class="text-4xl font-bold text-gray-900 mb-2">{{title}}</h1>
      <p class="text-lg text-gray-500 mb-8">Scan to check in</p>
      <div id="kiosk-qr" class="qr-keep-light inline-block bg-white p-6 rounded-2xl shadow-lg"></div>
      <p class="mt-6 text-sm text-gray-500 break-all" id="kiosk-url"></p>
    </div>
    <div class="text-center md:text-left"
         hx-get="/kiosk/{{entity_type}}/{{entity_id}}/recent" hx-trigger="load, every 5s" hx-swap="innerHTML">
      <p class="text-gray-400">Loading…</p>
    </div>
  </div>
  <button onclick="document.documentElement.requestFullscreen && document.documentElement.requestFullscreen()"
          class="fixed bottom-4 right-4 text-xs px-3 py-1.5 border border-gray-300 text-gray-600 rounded-lg hover:bg-gray-50">Full screen</button>
  <script>
    (function () {
      var url = window.location.origin + '/checkin/{{token}}';
      document.getElementById('kiosk-url').textContent = url;
      if (typeof QRCode !== 'undefined')
        new QRCode(document.getElementById('kiosk-qr'), { text: url, width: 360, height: 360 });
    })();
  </script>
</body>
</html>
