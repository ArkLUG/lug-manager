<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check-in Kiosk — {{title}}</title>
  <link rel="stylesheet" href="/static/tailwind.min.css?v={{asset_v}}">
  <script src="/static/theme.js?v={{asset_v}}"></script>
  <script src="/static/app.js?v={{asset_v}}" defer></script>
  <script src="/static/live.js?v={{asset_v}}" defer></script>
  <link rel="stylesheet" href="/static/theme.css?v={{asset_v}}">
  <link rel="stylesheet" href="/static/palettes.css?v={{asset_v}}">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#111827">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v={{asset_v}}">
  <script src="/static/vendor/htmx-1.9.12.min.js?v={{asset_v}}"></script>
  <script src="/static/vendor/qrcode-1.0.0.min.js?v={{asset_v}}"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8" data-live="1">
  <div class="max-w-6xl mx-auto grid md:grid-cols-2 gap-10 items-center min-h-[85vh]">
    <div class="text-center">
      <h1 class="text-4xl font-bold text-gray-900 mb-2">{{title}}</h1>
      <p class="text-lg text-gray-500 mb-8">Scan to check in</p>
      <div id="kiosk-qr" class="qr-keep-light inline-block bg-white p-6 rounded-2xl shadow-lg"></div>
      <p class="mt-6 text-sm text-gray-500 break-all" id="kiosk-url"></p>
    </div>
    <!-- Refreshed the moment someone checks in (live updates), and every
         minute in case the live connection is blocked. -->
    <div id="kiosk-recent" class="text-center md:text-left"
         hx-get="/kiosk/{{entity_type}}/{{entity_id}}/recent" hx-trigger="load, live, every 60s" hx-swap="innerHTML">
      <p class="text-gray-400">Loading…</p>
    </div>
  </div>
  <button data-action="fullscreen"
          class="fixed bottom-4 right-4 text-xs px-3 py-1.5 border border-gray-300 text-gray-600 rounded-lg hover:bg-gray-50">Full screen</button>
  <script>
    (function () {
      var url = window.location.origin + '/checkin/{{token}}';
      document.getElementById('kiosk-url').textContent = url;
      if (typeof QRCode !== 'undefined')
        new QRCode(document.getElementById('kiosk-qr'), { text: url, width: 360, height: 360 });
      var topic = '{{entity_type}}:{{entity_id}}';
      function hook() {
        if (!window.LiveSync) return;
        var el = document.getElementById('kiosk-recent');
        window.LiveSync.onChange(el, function (changes) {
          if (changes === 'all' || changes.indexOf(topic) >= 0) htmx.trigger(el, 'live');
          return true;
        });
      }
      if (window.LiveSync) hook(); else document.addEventListener('DOMContentLoaded', hook);
    })();
  </script>
</body>
</html>
