<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <title>Choose a password — LUG Manager</title>
  <link rel="stylesheet" href="/static/tailwind.min.css?v={{asset_v}}">
  <link rel="stylesheet" href="/static/theme.css?v={{asset_v}}">
  <link rel="stylesheet" href="/static/palettes.css?v={{asset_v}}">
  <script src="/static/theme.js?v={{asset_v}}"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4">
  <main class="w-full max-w-sm bg-gray-800 border border-gray-700 rounded-2xl p-8">
    <h1 class="text-xl font-bold text-white mb-2">Choose a password</h1>
    <p class="text-gray-400 text-sm mb-5">{{#name}}For {{name}}{{#email}} ({{email}}){{/email}}. {{/name}}Use at least 10 characters; a few unrelated words make a good one.</p>
    {{#error}}<div role="alert" class="mb-4 bg-red-900/40 border border-red-700/60 text-red-300 text-sm px-4 py-3 rounded-lg">{{error}}</div>{{/error}}
    <form method="post" action="/auth/reset/{{token}}" class="space-y-3">
      <input type="email" name="username" value="{{email}}" autocomplete="username" class="hidden" aria-hidden="true" aria-label="Email" tabindex="-1" readonly>
      <label class="block text-sm text-gray-300" for="password">New password</label>
      <input id="password" type="password" name="password" required minlength="10" maxlength="200" autocomplete="new-password"
             class="w-full rounded-xl bg-gray-900 border border-gray-600 text-white text-sm px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-yellow-400">
      <label class="block text-sm text-gray-300" for="confirm">Type it again</label>
      <input id="confirm" type="password" name="confirm" required minlength="10" maxlength="200" autocomplete="new-password"
             class="w-full rounded-xl bg-gray-900 border border-gray-600 text-white text-sm px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-yellow-400">
      <button class="w-full px-5 py-3 bg-yellow-400 text-gray-900 rounded-xl font-semibold hover:bg-yellow-300">Save password</button>
    </form>
    <p class="mt-4 text-xs text-gray-500">Saving signs you out on every device. Then sign in with your email and the new password.</p>
  </main>
</body>
</html>
