<div class="bg-green-50 border border-green-200 rounded-xl p-4 mb-6">
  <p class="text-sm font-semibold text-green-800 mb-1">API key created: {{label}} ({{scope}})</p>
  <p class="text-xs text-green-700 mb-2">
    Copy this key now — it will not be shown again.
  </p>
  <div class="flex items-center gap-2">
    <code id="new-api-key" class="flex-1 text-xs bg-white border border-green-300 rounded px-3 py-2 font-mono break-all">{{raw_key}}</code>
    <button type="button"
            onclick="navigator.clipboard.writeText(document.getElementById('new-api-key').textContent)"
            class="px-3 py-2 bg-green-600 text-white rounded-lg text-xs font-semibold hover:bg-green-700 transition-colors whitespace-nowrap">
      Copy
    </button>
  </div>
</div>
