<div class="text-xs space-y-1 mt-2">
  {{#sent}}<p class="text-green-700">Emailed to {{email}}. The link also works if you send it yourself:</p>{{/sent}}
  {{^sent}}<p class="text-gray-600">Send this to them yourself (it works once, for 24 hours, then they sign in with {{email}}):</p>{{/sent}}
  <div class="flex gap-2">
    <input readonly value="{{link}}" aria-label="Set-password link" data-action="select-self" class="flex-1 min-w-0 font-mono border border-gray-300 rounded px-2 py-1 bg-gray-50">
    <button type="button" data-action="copy" data-copy-target="[aria-label='Set-password link']" class="px-2 py-1 border border-gray-300 rounded text-gray-700 hover:bg-gray-50">Copy</button>
  </div>
</div>
