<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password — LUG Manager</title>
  <link rel="stylesheet" href="/static/tailwind.min.css?v={{asset_v}}">
  <link rel="stylesheet" href="/static/theme.css?v={{asset_v}}">
  <script src="/static/theme.js?v={{asset_v}}"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4">
  <main class="w-full max-w-sm bg-gray-800 border border-gray-700 rounded-2xl p-8">
    <h1 class="text-xl font-bold text-white mb-2">Forgot your password?</h1>
    <p class="text-gray-400 text-sm mb-5">Enter the email address on your member record. If it matches, we'll email you a link to choose a new password. The link works once, for an hour.</p>
    <form method="post" action="/auth/forgot" class="space-y-3">
      <label class="block text-sm text-gray-300" for="email">Email</label>
      <input id="email" type="email" name="email" required autocomplete="email" maxlength="254"
             class="w-full rounded-xl bg-gray-900 border border-gray-600 text-white text-sm px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-yellow-400">
      <button class="w-full px-5 py-3 bg-yellow-400 text-gray-900 rounded-xl font-semibold hover:bg-yellow-300">Email me a link</button>
    </form>
    <p class="mt-5 text-center text-xs text-gray-500"><a href="/login" class="underline">Back to sign in</a></p>
  </main>
</body>
</html>
