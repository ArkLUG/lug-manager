<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <title>Set up LUG Manager</title>
  <link rel="stylesheet" href="/static/tailwind.min.css?v={{asset_v}}">
  <link rel="stylesheet" href="/static/theme.css?v={{asset_v}}">
  <link rel="stylesheet" href="/static/palettes.css?v={{asset_v}}">
  <script src="/static/theme.js?v={{asset_v}}"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-gray-800 border border-gray-700 rounded-2xl p-8 space-y-5">
    <div>
      <h1 class="text-xl font-bold text-white">Welcome to LUG Manager</h1>
      <p class="text-gray-400 text-sm mt-1">Create the first admin account. This page only works until an admin exists.</p>
    </div>
    {{#error}}<div class="bg-red-900/40 border border-red-700/60 text-red-300 text-sm px-4 py-3 rounded-lg">{{error}}</div>{{/error}}
    <form method="post" action="/setup/admin" class="space-y-3 text-sm">
      <input type="hidden" name="token" value="{{token}}">
      <div class="grid grid-cols-2 gap-3">
        <input name="first_name" required maxlength="50" placeholder="First name" aria-label="First name"
               class="rounded-lg bg-gray-900 border border-gray-600 text-white px-3 py-2">
        <input name="last_name" maxlength="50" placeholder="Last name" aria-label="Last name"
               class="rounded-lg bg-gray-900 border border-gray-600 text-white px-3 py-2">
      </div>
      <label class="block text-gray-300">Your Discord user ID
        <input name="discord_user_id" inputmode="numeric" maxlength="30" placeholder="e.g. 123456789012345678"
               class="mt-1 w-full rounded-lg bg-gray-900 border border-gray-600 text-white px-3 py-2">
        <span class="text-xs text-gray-500">Discord: Settings &gt; Advanced &gt; Developer Mode, then right-click your name &gt; Copy User ID.</span>
      </label>
      <label class="block text-gray-300">Email <span class="text-gray-500">(if you'll sign in by email instead)</span>
        <input type="email" name="email" maxlength="200" class="mt-1 w-full rounded-lg bg-gray-900 border border-gray-600 text-white px-3 py-2">
      </label>
      <fieldset class="space-y-2 border-t border-gray-700 pt-3">
        <legend class="text-gray-300">Password <span class="text-gray-500">(to sign in with your email and a password)</span></legend>
        <input type="password" name="password" minlength="10" maxlength="200" autocomplete="new-password" placeholder="At least 10 characters" aria-label="Password"
               class="w-full rounded-lg bg-gray-900 border border-gray-600 text-white px-3 py-2">
        <input type="password" name="confirm" minlength="10" maxlength="200" autocomplete="new-password" placeholder="Type it again" aria-label="Type the password again"
               class="w-full rounded-lg bg-gray-900 border border-gray-600 text-white px-3 py-2">
      </fieldset>
      <button class="w-full px-5 py-3 bg-yellow-400 text-gray-900 rounded-xl font-semibold hover:bg-yellow-300">Create admin</button>
    </form>
  </div>
</body>
</html>
