<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two-factor code — LUG Manager</title>
  <link rel="stylesheet" href="/static/tailwind.min.css?v={{asset_v}}">
  <link rel="stylesheet" href="/static/theme.css?v={{asset_v}}">
  <script src="/static/theme.js?v={{asset_v}}"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4">
  <main class="w-full max-w-sm bg-gray-800 border border-gray-700 rounded-2xl p-8">
    <h1 class="text-xl font-bold text-white mb-2">Enter your code</h1>
    <p class="text-gray-400 text-sm mb-5">Open your authenticator app and enter the 6-digit code for LUG Manager. Lost your phone? Enter one of your recovery codes instead.</p>
    {{#error}}<div role="alert" class="mb-4 bg-red-900/40 border border-red-700/60 text-red-300 text-sm px-4 py-3 rounded-lg">That code didn't work. Tries left: {{left}}.</div>{{/error}}
    <form method="post" action="/auth/2fa" class="space-y-3">
      <label class="block text-sm text-gray-300" for="code">Code</label>
      <input id="code" name="code" required autofocus autocomplete="one-time-code" inputmode="text" maxlength="40"
             class="w-full rounded-xl bg-gray-900 border border-gray-600 text-white text-lg tracking-widest px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-yellow-400">
      <button class="w-full px-5 py-3 bg-yellow-400 text-gray-900 rounded-xl font-semibold hover:bg-yellow-300">Sign in</button>
    </form>
    <p class="mt-5 text-center text-xs text-gray-500"><a href="/login" class="underline">Start over</a></p>
  </main>
</body>
</html>
