<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — LUG Manager</title>
  <link rel="stylesheet" href="/static/tailwind.min.css?v={{asset_v}}">
  <link rel="stylesheet" href="/static/theme.css?v={{asset_v}}">
  <link rel="stylesheet" href="/static/palettes.css?v={{asset_v}}">
  <script src="/static/theme.js?v={{asset_v}}"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm bg-gray-800 border border-gray-700 rounded-2xl p-8 text-center">
    <h1 class="text-xl font-bold text-white mb-2">Sign in to LUG Manager</h1>
    <p class="text-gray-400 text-sm mb-6">Continue to sign in with your email link.</p>
    <form method="post" action="/auth/email/{{token}}">
      <button class="w-full px-5 py-3 bg-yellow-400 text-gray-900 rounded-xl font-semibold hover:bg-yellow-300">Continue</button>
    </form>
  </div>
</body>
</html>
