<div id="sessions-panel" class="space-y-2">
  <ul class="divide-y divide-gray-100 text-sm">
    {{#sessions}}
    <li class="flex items-center justify-between py-1.5">
      <span class="text-gray-800">{{device}}{{#current}} <span class="ml-1 px-1.5 py-0.5 rounded text-xs bg-green-100 text-green-700">this device</span>{{/current}}</span>
      <span class="text-xs text-gray-500">since {{since}} UTC</span>
    </li>
    {{/sessions}}
  </ul>
  {{#has_others}}
  <button hx-post="/account/sessions/revoke-others" hx-target="#sessions-panel" hx-swap="outerHTML"
          hx-confirm="Sign out of all other devices?"
          class="text-xs px-3 py-1.5 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50">Sign out everywhere else</button>
  {{/has_others}}
  {{#flash}}<p class="text-xs text-gray-500">{{flash}}</p>{{/flash}}
</div>
